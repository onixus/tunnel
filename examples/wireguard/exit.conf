# Install as /etc/wireguard/wg-private.conf, root:root 0600.
# Configure the host firewall before starting; see docs/interserver.md.
[Interface]
Address = 10.254.77.2/32
ListenPort = 51830
PrivateKey = REPLACE_LOCALLY_EXIT_PRIVATE_KEY
MTU = 1380

[Peer]
PublicKey = REPLACE_LOCALLY_INGRESS_PUBLIC_KEY
AllowedIPs = 10.254.77.1/32
Endpoint = 192.0.2.10:51830
PersistentKeepalive = 25
