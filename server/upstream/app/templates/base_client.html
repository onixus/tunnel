{% from '_icons.html' import icon %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Кабинет{% endblock %} — {{ brand }}</title>
  <script src="/static/apex/theme.js"></script>
  <link rel="stylesheet" href="/static/apex/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/apex/components.css">
</head>
<body class="client">
<header class="topbar-client">
  <span class="brand">
    <span class="logo">{{ icon('shield', 20) }}</span>
    <span>{{ brand }} <small>личный кабинет</small></span>
  </span>
  <span class="sp"></span>
  <label class="theme-switch"><span>Тема</span><select data-theme-switch aria-label="Тема"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="system">Как в системе</option></select></label>
  {% if request.cookies.get('user_token') %}
  <a href="/logout" class="icon-btn" aria-label="Выйти" style="color:var(--fg);">{{ icon('logout', 20) }}</a>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
<script>
  function copyText(t, btn) {
    navigator.clipboard.writeText(t).then(function(){
      btn.classList.add('ok');
      var old = btn.innerHTML;
      btn.innerHTML = 'Скопировано ✓';
      setTimeout(function(){ btn.innerHTML = old; btn.classList.remove('ok'); }, 1500);
    });
  }
</script>
</body>
</html>
