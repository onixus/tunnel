<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="csrf-token" content="{{ csrf }}" />
    <title>Onixus · VPN Console</title>
    <script src="/console/static/apex/theme.js"></script>
    <link rel="stylesheet" href="/console/static/apex/tokens.css">
    <link rel="stylesheet" href="/console/static/console.css" />
    <link rel="stylesheet" href="/console/static/config-export.css" />
    <script src="/console/static/config-export.js" defer></script>
    <link rel="stylesheet" href="/console/static/routing.css" />
    <script src="/console/static/console.js" defer></script>
    <script src="/console/static/routing-ui.js" defer></script>
    <link rel="stylesheet" href="/console/static/protocols.css" />
    <script src="/console/static/protocols-ui.js" defer></script>
    <link rel="stylesheet" href="/console/static/apex/components.css">
  </head>
  <body>
    <aside>
      <a class="brand" href="/console"
        ><span class="mark">O</span
        ><span>ONIXUS<small>NETWORK CONSOLE</small></span></a
      >
      <div class="nav-label">УПРАВЛЕНИЕ</div>
      <nav aria-label="Разделы">
        <button data-page="overview" class="selected"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Обзор сети</span></button
        ><button data-page="users"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.8 3 2.5 3.5 5.2"/></svg><span>Пользователи</span></button
        ><button data-page="keys"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M16 7l3 3M18 5l2 2"/></svg><span>Ключи и устройства</span></button
        ><button data-page="routing"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></svg><span>Маршрутизация</span></button
        ><button data-page="protocols"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></svg><span>Протоколы</span></button
        ><button data-page="updates"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Обновления</span></button
        ><button data-page="campaigns"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg><span>Рассылки</span></button
        ><button data-page="telegram"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l6.5 2.5L18 7l-6.5 7.5L17 20z"/></svg><span>Telegram</span></button
        ><button data-page="audit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/></svg><span>Журнал операций</span></button>
      </nav>
      <div class="sidebar-bottom">
        <span class="host-dot"></span> onixus-rf<small
          >Единый центр управления</small
        ><a href="/admin/agent-routes">Маршруты устройств ↗</a
        ><a href="/admin/settings">Настройки TrustTunnel ↗</a
        ><a href="/admin/logout">Выйти</a>
      </div>
    </aside>
    <div class="workspace">
      <header>
        <span
          >Инфраструктура <span class="muted">/</span>
          <b id="breadcrumb">Обзор сети</b></span
        >
        <div class="header-right">
          <label class="theme-switch"><span>Тема</span><select data-theme-switch aria-label="Тема"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="system">Как в системе</option></select></label>
          <span class="live" id="freshness">Подключение…</span
          ><button id="refresh" class="subtle">Обновить</button>
        </div>
      </header>
      <main>
        <div id="notice" role="status" aria-live="polite"></div>
        <div id="content">
          <div class="empty">Загружаем состояние узлов…</div>
        </div>
      </main>
      <footer>
        Hysteria 2 · TrustTunnel · AmneziaWG 3.1 · VLESS CDN · R-TrustTunnel
        <span>Управление через существующие сервисы</span>
      </footer>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <form method="dialog" class="dialog-top">
        <b id="modal-title"></b><button aria-label="Закрыть">×</button>
      </form>
      <div id="modal-error" class="modal-error" role="alert" hidden></div>
      <div id="modal-body"></div>
    </dialog>
  </body>
</html>
